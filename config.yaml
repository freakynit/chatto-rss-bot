# Bot Hub registration for this bot. Register these exact values in the hub
# dashboard, then install: the hub provisions the Chatto bot and POSTs the
# API key + grant report to the callback URL below.
hub:
  bot_login: ${HUB_BOT_LOGIN:-awesome_rss_bot}
  bot_display_name: ${HUB_BOT_DISPLAY_NAME:-Awesome RSS Bot}
  bot_description: ${HUB_BOT_DESCRIPTION:-Publishes RSS/Atom feeds to channels. Mention me to add, pause, remove or list subscriptions.}
  callback_public_url: ${HUB_CALLBACK_URL:-https://chatto-rss-bot.stupidlabs.lol/chatto/callback}
  requested_permissions:
    - message.read
    - message.read-interactions
    - message.post-in-interactions
  requested_rooms:
    - general
    - Standup

# Local webhook listener that receives the hub install callback.
# Receipts (server URL + api_key) are stored in the SQLite database below,
# so one bot instance can serve installs on any number of servers.
webhook:
  port: ${WEBHOOK_PORT:-9028}
  path: ${WEBHOOK_PATH:-/chatto/callback}

# No chatto server URL or token here: both arrive via hub install callbacks.

feed:
  database_file: ${RSS_DATABASE_FILE:-feeds.sqlite}
  max_items_per_poll: ${RSS_MAX_ITEMS_PER_POLL:-10}
  max_article_characters: ${RSS_MAX_ARTICLE_CHARACTERS:-7000}
  fetch_article: ${RSS_FETCH_ARTICLE:-true}
  http_timeout_seconds: ${RSS_HTTP_TIMEOUT_SECONDS:-20}
